<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="catGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb4a2"/>
      <stop offset="100%" stop-color="#e5989b"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e24"/>
      <stop offset="100%" stop-color="#0b090a"/>
    </linearGradient>
  </defs>

  <!-- Dark rounded background for clear contrast in browser tab -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>

  <!-- Left Cat Ear -->
  <polygon points="12,30 20,8 30,22" fill="#f4f1de"/>
  <polygon points="15,27 21,13 27,22" fill="#ffb4a2"/>

  <!-- Right Cat Ear -->
  <polygon points="52,30 44,8 34,22" fill="#f4f1de"/>
  <polygon points="49,27 43,13 37,22" fill="#ffb4a2"/>

  <!-- Cat Head -->
  <ellipse cx="32" cy="36" rx="22" ry="18" fill="#f4f1de"/>

  <!-- Cute Eyes -->
  <ellipse cx="23" cy="34" rx="3.5" ry="4.5" fill="#1b1b1e"/>
  <ellipse cx="41" cy="34" rx="3.5" ry="4.5" fill="#1b1b1e"/>
  <!-- Eye Highlights -->
  <circle cx="21.5" cy="32.5" r="1.4" fill="#ffffff"/>
  <circle cx="24" cy="35.5" r="0.7" fill="#ffffff"/>
  <circle cx="39.5" cy="32.5" r="1.4" fill="#ffffff"/>
  <circle cx="42" cy="35.5" r="0.7" fill="#ffffff"/>

  <!-- Pink Heart Nose -->
  <path d="M32 40 C30.8 38.5 29 39 29 40.5 C29 41.8 32 43.5 32 43.5 C32 43.5 35 41.8 35 40.5 C35 39 33.2 38.5 32 40 Z" fill="#e5989b"/>

  <!-- Mouth -->
  <path d="M29 43.2 Q26 45.5 24 44" fill="none" stroke="#6d6875" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M35 43.2 Q38 45.5 40 44" fill="none" stroke="#6d6875" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Blush Cheeks -->
  <ellipse cx="16" cy="39" rx="3" ry="1.8" fill="#ffb4a2" opacity="0.75"/>
  <ellipse cx="48" cy="39" rx="3" ry="1.8" fill="#ffb4a2" opacity="0.75"/>

  <!-- Whiskers -->
  <path d="M18 36 L7 34" stroke="#6d6875" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M17 40 L6 41" stroke="#6d6875" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M46 36 L57 34" stroke="#6d6875" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M47 40 L58 41" stroke="#6d6875" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Cute Mini Birthday Party Hat -->
  <polygon points="32,4 25,18 39,18" fill="#e76f51"/>
  <polygon points="32,4 28,18 36,18" fill="#f4a261"/>
  <circle cx="32" cy="3.5" r="2.2" fill="#e9c46a"/>
</svg>